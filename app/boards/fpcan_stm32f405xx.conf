# Throughput investigation instrumentation: track bxCAN hardware FIFO overrun
# counts (RX drop point A, upstream of gs_usb). The bxCAN driver already logs
# "RX FIFO Overflow" per event at LOG_ERR level (can_stm32_bxcan.c) whenever
# this fires; enabling CAN_STATS additionally keeps a running total counter
# reachable via can_stats_get_rx_overruns(), for future shell/API exposure.
# CAN_STATS depends on the generic Kconfig STATS subsystem (drivers/can/Kconfig);
# without it, CONFIG_CAN_STATS=y is silently dropped and "can show" prints no
# statistics block at all.
CONFIG_STATS=y
CONFIG_CAN_STATS=y

# Fix pass 1 (2026-08-12): the 2026-08-12 RTR-flood measurement showed the
# gs_usb host-frame buffer pool exhausting (see rx_drops instrumentation
# above) as the dominant loss cause, driven by the bulk-IN path submitting
# one CAN frame per USB round trip. Pipelining is fixed in gs_usb.c itself
# (CONFIG_USBD_GS_USB_MAX_IN_FLIGHT default of 4); the pool is grown here,
# board-specific, since fpcan shares one pool across CAN1 and CAN2
# (fpcan.dts) and needs enough buffers to cover both the deeper in-flight
# pipeline and two channels' worth of burst traffic.
#
# Fix pass 2 (2026-08-12): pass 1 (pool=64, in-flight=8) cut loss from 5.72%
# to 3.04%, but pool exhaustion is still ~98% of the remaining loss (10150 of
# 10314 missed frames), so the pool is still the binding constraint, not some
# other point in the pipeline. fpcan has F405's 128 KB SRAM and this app is
# using well under a quarter of it, so both knobs are raised again, well past
# what pass 1 used, to see how much further pure buffering/pipelining depth
# can drive the loss down before hitting a different bottleneck (e.g. sustained
# USB FS bulk-IN throughput itself).
CONFIG_USBD_GS_USB_POOL_SIZE=256
CONFIG_USBD_GS_USB_MAX_IN_FLIGHT=32

# Fix pass 3 (2026-08-13): pass 2 (pool=256, in-flight=32) cut loss further to
# 2.05%, but rx_drops still explained essentially all of it, and "can show"
# confirmed the bxCAN hardware RX overrun counter is 0 -- the drop is entirely
# on the gs_usb/USB side, not the CAN hardware side. Packing multiple gs_usb
# host frames into a single bulk IN transfer (the other item on the original
# candidate list) was considered and rejected: the Linux gs_usb driver (and
# python-can) expects exactly one host frame per bulk IN transfer, so batching
# would break interoperability with real host tooling instead of just moving a
# bottleneck.
#
# Instead: CONFIG_USBD_GS_USB_MAX_IN_FLIGHT=32 allows up to 32 bulk IN
# transfers outstanding at once, but every completion has to pass through the
# STM32 UDC driver's own ISR event queue, CONFIG_UDC_STM32_MAX_QMESSAGES
# (drivers/usb/udc/Kconfig.stm32), which defaults to 8 and was never raised
# alongside in-flight depth. That queue put is also K_NO_WAIT/silent on
# overrun (udc_stm32.c), and losing a completion event there means the
# gs_usb in_sem permit for that transfer is never given back -- a leaked
# permit that permanently shrinks the effective in-flight window for the rest
# of the run. This is a much better explanation for the diminishing returns in
# pass 2 (4x the buffers only bought ~30% less loss) than pool size itself:
# the real ceiling was this fixed 8-deep queue downstream of the growing
# pipeline. Each queued message is 4 bytes, so raising the depth is nearly
# free; set to the Kconfig maximum (64) so it's never smaller than
# MAX_IN_FLIGHT above.
CONFIG_UDC_STM32_MAX_QMESSAGES=64

# Shell over Segger RTT (kept for "can show" hardware-overrun checks between
# runs). RTT is used instead of a UART/USB CDC-ACM console because both
# USARTs are free for other use on this board and the only USB endpoint is
# owned by the gs_usb class (zephyr,console/zephyr,shell chosen nodes point
# at zephyr_udc0, i.e. the gs_usb USB device itself, not a CDC-ACM instance).
# SHELL does not depend on LOG, so it stays usable with logging off below.
CONFIG_USE_SEGGER_RTT=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_CAN_SHELL=y

# 2026-08-13: disabled to measure without RTT/LOG overhead in the hot path
# (each drop was emitting a LOG_ERR; under sustained loss that's hundreds of
# RTT writes/sec competing with the pipeline being measured). The rx_drops /
# msgq_overruns atomic counters still increment correctly with LOG off (the
# increment was moved out of the LOG_ERR call arguments in gs_usb.c /
# udc_stm32.c specifically so it wouldn't be skipped when logging is
# compiled out) -- there's just no way to read their value without LOG or a
# shell command for it, so re-enable CONFIG_LOG=y temporarily if you need the
# device-side drop counts for this run, or compare host-observed loss alone
# against the pass-3 numbers to isolate the logging-overhead effect.
CONFIG_LOG=n
